[project]
name = "zany-agent"
version = "0.1.0"
description = "zany-agent: 无框架手写核心 (core/)"
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx>=0.27",  # 裸 httpx 直调 /v1/messages, 不引 anthropic SDK(导入重: 拖 pydantic, Windows 上 6s+)
    "mcp>=2.0,<3.0",
    "croniter>=2.0",
    "textual>=1.0",
    "socksio>=1.0.0",
]

# dev 工具(pyinstaller 打包 / pytest 测试), uv sync 默认装 dev 组
[dependency-groups]
dev = ["pyinstaller>=6.10", "pytest>=8.0"]

# 能力插件的重依赖走 extras, 基座默认不装(core/plugins/<name>.py 的 import 失败即降级为工具缺席)
# UV_PIP_INDEX_URL 只管 uv pip;uv run/lock 解析走这里,否则连 pypi.org 会很慢
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
