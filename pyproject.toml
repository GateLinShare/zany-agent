[project]
name = "mini-agent"
version = "0.1.0"
description = "Mini coding agent, 无框架手写核心 (core/)"
requires-python = ">=3.11,<4.0"
dependencies = [
    "anthropic>=0.40",
    "mcp>=2.0,<3.0",
    "croniter>=2.0",
    "textual>=1.0",
]

# UV_PIP_INDEX_URL 只管 uv pip;uv run/lock 解析走这里,否则连 pypi.org 会很慢
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
